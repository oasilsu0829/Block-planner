<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>15577</title>
<meta name="apple-mobile-web-app-title" content="15577">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
<style>
/* ════════ 15577: 텍스트 중심 미니멀 ════════
   색은 잉크 한 가지 + 과목 색 점. 면 대신 1px 선, 장식 대신 움직임 */
:root{
  --bg:#FBFBFA; --card:#FFFFFF; --ink:#16171A; --muted:#6B6E76; --dim:#A3A6AD;
  --line:rgba(22,23,26,.09); --line2:rgba(22,23,26,.16); --soft:rgba(22,23,26,.045);
  --hi:#16171A; --hi-ink:#FFFFFF; --warn:#D2483F; --meal:#C98A3B;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.5,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0E0F11; --card:#17181B; --ink:#EDEEF0; --muted:#9A9DA5; --dim:#5E616A;
    --line:rgba(237,238,240,.08); --line2:rgba(237,238,240,.16); --soft:rgba(237,238,240,.05);
    --hi:#EDEEF0; --hi-ink:#0E0F11; color-scheme:dark}
}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);font-size:15px;line-height:1.5;
  letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;
  transition:transform .3s var(--spring),background-color .2s,color .2s,border-color .2s,opacity .2s}
button:active{transform:scale(.95)}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.glass{background:var(--card);border:1px solid var(--line)}
.muted{color:var(--muted)}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:14px 16px 12px;gap:10px}

/* ── 상단 ── */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.datebar{display:flex;align-items:center;gap:2px;min-width:0}
.icon{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center}
.icon:hover{color:var(--ink);background:var(--soft)}
.date{padding:0 6px;text-align:left}
.nixie{display:block;font-size:34px;font-weight:700;line-height:1;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.date small{display:block;margin-top:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.date small em{font-style:normal;color:var(--ink);font-weight:600;margin-left:6px}
.right{display:flex;align-items:center;gap:8px;flex:none;position:relative}
#led{position:absolute;left:-12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:transparent;transition:background .3s}
#led.on{background:var(--warn);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.seg{display:flex;position:relative;font-size:14px}
.seg button{padding:6px 10px;color:var(--dim);font-weight:500;white-space:nowrap;position:relative}
.seg button::after{content:"";position:absolute;left:10px;right:10px;bottom:1px;height:1.5px;background:var(--ink);border-radius:2px;
  transform:scaleX(0);transition:transform .35s var(--ease)}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:600}
.seg button[aria-selected="true"]::after{transform:scaleX(1)}
.dday{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;text-align:right;max-width:110px}
.dday small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dday b{font-size:17px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dday.soon b{color:var(--warn)}
.dday.none small{font-size:12.5px}

.dash{display:flex;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dash>:not([hidden])~:not([hidden]){border-top:1px solid var(--line)}
.nowbar,.memobar{display:flex;align-items:center;gap:8px;width:100%;height:38px;font-size:13.5px;text-align:left;min-width:0}
.nowbar .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.nowbar .dot.on{background:var(--ink);animation:pulse 2s ease-in-out infinite}
.nowbar .k,.memobar .mk{color:var(--muted);font-size:12.5px;flex:none;min-width:28px}
.nowbar b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar .r{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
.memobar .mk{font-weight:700;color:var(--ink)}
.memobar .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memobar .mt.muted{color:var(--dim)}
.memobar .mm{flex:none;font-size:12px;color:var(--muted)}
.memobar:active{transform:none;opacity:.6}

/* ── 화면 ── */
.screen{position:relative;flex:1;min-height:0;overflow:hidden}
.carry{position:absolute;top:6px;left:0;right:0;z-index:4;display:flex;flex-direction:column;gap:6px;animation:drop .4s var(--ease)}
.carry button{width:100%;text-align:left;padding:9px 14px;font-size:13.5px;border-radius:10px;background:var(--card);border:1px solid var(--line2)}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}

/* ── 타임라인 ── */
.timeline{position:relative;margin:14px 0 30px}
.hour{position:absolute;left:34px;right:0;border-top:1px solid var(--line)}
.hour span{position:absolute;left:-34px;top:-9px;font-size:11.5px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
.lane{position:absolute;left:40px;right:0;top:0;bottom:0}
.now{position:absolute;left:30px;right:0;height:1.5px;background:var(--warn);z-index:4;pointer-events:none;transition:top 1s linear}
.now::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

.blk{position:absolute;left:0;right:0;border-radius:10px;overflow:hidden;cursor:pointer;z-index:2;display:flex;align-items:stretch;
  background:var(--card);border:1px solid var(--line2);
  transition:top .35s var(--ease),height .35s var(--ease),background-color .25s,border-color .25s,box-shadow .25s,opacity .25s}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.blk-body{flex:1;min-width:0;padding:6px 6px 6px 13px}
.title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.meta{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.meta .tm,.meta .st{font-variant-numeric:tabular-nums}
.meta .tag{color:var(--c);font-weight:600}
.blk.dragging{transition:background-color .2s,box-shadow .2s;z-index:6;box-shadow:0 12px 32px rgba(0,0,0,.14);transform:scale(1.015)}
.blk.running{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.blk.running .st{color:var(--ink);font-weight:600}
.blk.running .st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:5px;vertical-align:1px;animation:pulse 1.2s ease-in-out infinite}
.blk.over .st{color:var(--warn)}
.blk.done{background:transparent;border-color:var(--line)}
.blk.done::before{opacity:.35}
.blk.done .title{color:var(--muted);font-weight:500}
.blk.done .title span{text-decoration:line-through;text-decoration-thickness:1px}
.dchk{position:absolute;right:10px;top:7px;font-style:normal;font-size:12px;color:var(--muted)}
.blk.review{background:transparent;border-style:dashed}
.blk.review .title{font-weight:500}
.blk.lecture .title::before{content:"▸ ";color:var(--c)}
.blk.school{z-index:1;background:var(--soft);border-color:transparent}
.blk.school::before{display:none}
.school .per{position:absolute;left:9px;top:7px;font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.school .per::after{content:"교시";font-weight:500;font-size:10px;margin-left:1px}
.school .blk-body{padding-left:44px}
.school .title{font-weight:500;font-size:14px}
.blk.school.cur{background:var(--card);border-color:var(--ink)}
.blk.fixed{z-index:1;background:var(--soft);border-color:transparent}
.blk.fixed::before{background:var(--muted)}
.blk.fixed .title{font-weight:500}
.compact .blk-body{display:flex;align-items:center;padding-top:0;padding-bottom:0}
.compact .meta{display:none}
.compact .blk-actions{align-items:center;padding-top:0}
.compact .act{width:26px;height:26px}
.school.compact .per{top:50%;transform:translateY(-50%)}
.compact .dchk{top:50%;transform:translateY(-50%)}
.tiny .blk-actions{display:none}
.tiny .title{font-size:12.5px}
.blk-actions{display:flex;align-items:flex-start;gap:4px;padding:6px 2px 0 0}
.act{width:30px;height:30px;flex:none;border-radius:50%;font-size:11px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line2)}
.act:hover{color:var(--ink);border-color:var(--ink)}
.act.on,.act.chk.on,.act.lp.full{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.act.lp{width:auto;min-width:42px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.grip{width:22px;flex:none;touch-action:none;cursor:grab;position:relative}
.grip::before{content:"⋮⋮";position:absolute;inset:0;display:grid;place-items:center;font-size:10px;letter-spacing:-3px;color:var(--dim)}
.resize{position:absolute;left:0;right:22px;bottom:0;height:12px;touch-action:none;cursor:ns-resize}
.resize::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:2px;margin-left:-9px;border-radius:2px;background:var(--line2)}
.mband{position:absolute;left:0;right:0;z-index:0;pointer-events:none;border-left:2px solid var(--meal);
  background:color-mix(in srgb,var(--meal) 7%,transparent)}
.mband .mtag{pointer-events:auto;position:absolute;left:-40px;top:2px;width:34px;padding:2px 0;font-size:10px;line-height:1.25;color:var(--meal);font-weight:600;text-align:center}
.mband .mlb{position:absolute;right:8px;bottom:3px;font-size:10.5px;color:var(--meal);font-weight:500}
.jband{position:absolute;left:0;right:0;z-index:0;cursor:pointer}
.empty{position:absolute;left:40px;right:0;padding:16px;border-radius:12px;font-size:13.5px;color:var(--muted);line-height:1.7;
  background:var(--card);border:1px dashed var(--line2);z-index:3}
.empty b{color:var(--ink)}

/* 날짜·탭을 바꾼 순간 블록이 순서대로 올라옴 */
main[data-enter] .blk,main[data-enter] .settle>*,main[data-enter] .stats>*{animation:rise .5s var(--ease) both}
main[data-enter] .blk:nth-child(2n){animation-delay:.03s}
main[data-enter] .blk:nth-child(3n){animation-delay:.06s}
main[data-enter] .settle>:nth-child(n+2),main[data-enter] .stats>:nth-child(n+2){animation-delay:.05s}
main[data-enter] .settle>:nth-child(n+4),main[data-enter] .stats>:nth-child(n+4){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}

/* ── 하단 바 ── */
.bar{display:flex;gap:8px}
.key{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;flex:1;min-width:0;
  border:1px solid var(--line2);background:var(--card);font-variant-numeric:tabular-nums}
.key b{font-weight:400;font-size:17px;line-height:1}
.key span{font-size:14px;font-weight:600;white-space:nowrap}
.key-red{flex:1.6;background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.key-fs{flex:none;width:48px;padding:0}
.key.on-focus{border-color:var(--ink)}

/* ── 기록 탭 ── */
.settle h2,.stats h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:22px 0 8px;letter-spacing:0}
.settle>h2:first-child{margin-top:8px}
.empty-line,.stats-empty{color:var(--muted);font-size:14px;line-height:1.7;margin:4px 0}
.stats-empty{padding:0;border:0;background:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum b{display:block;font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.sum small{font-size:12px;color:var(--muted)}
.pbar{height:3px;border-radius:3px;background:var(--line);margin:14px 0 4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:3px;animation:grow .9s var(--ease) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.slist,.log{list-style:none;margin:14px 0 0;padding:0}
.slist li{padding:11px 0;border-bottom:1px solid var(--line)}
.slist .r1{display:flex;align-items:center;gap:8px;min-width:0}
.slist .r1 i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.slist .r1 b{font-weight:600;font-size:14.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .k,.slist .pm{font-size:12px;color:var(--muted);flex:none}
.slist li.done b{color:var(--muted);font-weight:500}
.slist .v{display:inline-block;margin:6px 0 0 14px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.slist .v.run{color:var(--warn);font-weight:600}
.undo{font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-left:10px}
.prog{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.slist .prog{margin-left:14px}
.prog button{height:30px;border-radius:8px;font-size:12.5px;color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.prog button[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi);font-weight:600}
.lead{margin:0;padding:0;background:none;border:0;font-size:14px;color:var(--muted);line-height:1.6}
.lead b{display:block;font-size:30px;color:var(--ink);font-weight:700;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums}
.legend{font-size:12px;color:var(--dim);margin:-4px 0 8px}
.cat-row{padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none}
.cat-row .h{display:flex;align-items:center;gap:8px}
.cat-row .h::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.cat-row .h b{font-weight:600}
.cat-row .h span{margin-left:auto;font-size:12px;color:var(--muted)}
.cat-row p{margin:3px 0 8px;font-size:13px;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums}
.cat-row p b{color:var(--ink)}
.cmp{position:relative;height:3px;border-radius:3px;background:var(--line)}
.cmp .a{height:100%;border-radius:3px;background:var(--c);animation:grow .9s var(--ease) both;transform-origin:left}
.cmp .e{position:absolute;top:-4px;width:2px;height:11px;border-radius:1px;background:var(--ink)}
.log{background:none;border:0}
.log li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.log .d{color:var(--dim);font-size:12px;width:36px;flex:none;font-variant-numeric:tabular-nums}
.log .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .v{color:var(--muted);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
.log .v b{color:var(--ink)}
.log button{color:var(--dim);width:26px;height:26px;border-radius:50%;font-size:11px;flex:none}
.sync{font-size:12px;color:var(--dim);margin:26px 0 0}
.xfer,.upd{margin-top:10px;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;border-radius:0}
.xfer>b,.upd .hd b{font-size:14px;font-weight:600}
.xfer p{font-size:13px;color:var(--muted);line-height:1.6;margin:6px 0 10px}
.xfer .row,.upd .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.xfer button,.xfer label,.upd .chk{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;cursor:pointer;background:none}
.xfer button.go,.upd .chk.go{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.xfer textarea{width:100%;height:110px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:12px;font-family:ui-monospace,monospace;resize:vertical}
.xfer .in{margin-top:2px}
.xfer .sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.xfer .sub p{margin-top:4px}
.xfer .st{font-size:12.5px;color:var(--ink);margin:0}
.cid{font-family:ui-monospace,monospace;font-size:.95em;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--ink)}
.upd .hd{display:flex;align-items:baseline;justify-content:space-between}
.upd .ver{font-size:12px;color:var(--muted)}
.upd ol{list-style:none;margin:8px 0;padding:0}
.upd li{display:flex;gap:12px;padding:6px 0;font-size:13px}
.upd li .v{flex:none;width:52px;display:flex;flex-direction:column;line-height:1.3}
.upd li .v span{font-size:11px;color:var(--dim)}
.upd li p{margin:0;color:var(--muted);line-height:1.55}
.upd summary{font-size:12.5px;color:var(--muted);cursor:pointer;padding:4px 0}
.upd .chk{margin-top:6px}

/* ── 시트 ── */
.sheet-wrap{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);animation:fade .3s var(--ease)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:var(--bg);border-top:1px solid var(--line2);
  animation:up .45s var(--ease)}
.sheet-wrap.closing .sheet{animation:down .2s ease-in forwards}
.sheet-wrap.closing .scrim{animation:fade .2s ease-in reverse forwards}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sh-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.03em}
.sh-head .icon{font-size:14px}
.f{display:block;margin-top:16px}
.f>span,.lbl-row{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.f small,.note{display:block;font-size:12px;color:var(--dim);margin-top:6px;line-height:1.55}
.in{width:100%;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-size:15px;outline:none;transition:border-color .2s}
.in:focus{border-color:var(--ink)}
.in::placeholder{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center}
.row .in{flex:1;min-width:0}
.in.unit{flex:0 0 90px}
.textbtn{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:12px}
.textbtn.sm{margin:0;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.chip.add{border-style:dashed;color:var(--muted)}
.newcat{margin-top:8px}
.ghost{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);font-size:14px}
.primary{height:48px;padding:0 22px;border-radius:12px;background:var(--hi);color:var(--hi-ink);font-weight:600;font-size:15px}
.primary.sm{height:44px;padding:0 16px;flex:none}
.danger{height:48px;padding:0 16px;border-radius:12px;color:var(--warn);font-size:14px;border:1px solid transparent}
.danger.arm{border-color:var(--warn);font-weight:600}
.danger.sm{height:36px;padding:0 10px;font-size:12.5px}
.sh-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:22px}
.sh-foot .primary{flex:1;max-width:220px}
.sh-foot .danger{margin-right:auto}
.hint{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.6}
.hint div+div{margin-top:4px}
.hint b{color:var(--ink)}
.hint button{margin-left:8px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);font-size:12px;font-weight:600}
.timer-row{display:flex;gap:8px;margin-top:18px}
.timer-row button{flex:1;height:44px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:14px}
.pick{display:flex;flex-direction:column;margin-top:6px}
.pick button{display:grid;grid-template-columns:30px 1fr;align-items:baseline;column-gap:6px;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line);
  animation:rise .4s var(--ease) both}
.pick button:last-child{border-bottom:0}
.pick button:nth-child(2){animation-delay:.03s}.pick button:nth-child(3){animation-delay:.06s}.pick button:nth-child(4){animation-delay:.09s}
.pick button:nth-child(5){animation-delay:.12s}.pick button:nth-child(6){animation-delay:.15s}
.pick i{font-style:normal;color:var(--muted);grid-row:span 2;font-size:16px}
.pick b{font-weight:600;font-size:15.5px}
.pick small{color:var(--muted);font-size:12.5px}

/* 시간 다이얼 */
.dialset{position:relative;width:200px;height:200px;margin:4px auto 0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:50%}
.dialset.turning{cursor:grabbing}
.dialset svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dialset .tk{stroke:var(--line2);stroke-width:1.5;stroke-linecap:round}
.dialset .tk.big{stroke:var(--dim)}
.dialset .trk{fill:none;stroke:var(--line);stroke-width:6}
.dialset .arc{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;transition:stroke-dasharray .12s var(--ease)}
.dialset .disc{fill:transparent}
.dialset .thumb{fill:var(--bg);stroke:var(--ink);stroke-width:2.5;transition:r .2s var(--spring)}
.dialset.turning .thumb{r:14}
.dial-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial-mid output{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.dial-mid small{margin-top:4px;font-size:12px;color:var(--muted)}

/* 메모 · 과목 · 고정 */
.memoin{margin:12px 0 10px}
.mscope{grid-template-columns:1fr 1fr!important;margin-bottom:8px}
.memolist{list-style:none;margin:0;padding:0}
.memolist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .3s var(--ease) both}
.memolist .mtx{flex:1;min-width:0;font-size:14.5px;line-height:1.45;word-break:break-word}
.memolist .mtx small{display:block;font-size:11px;color:var(--dim)}
.memolist li.done .mtx{color:var(--dim);text-decoration:line-through}
.mchk{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);color:transparent;font-size:12px}
.mchk[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.mdel{flex:none;min-width:28px;height:28px;color:var(--dim);font-size:12.5px;padding:0 6px}
.sess-note{font-size:13px;color:var(--muted);line-height:1.6;margin:8px 0 0}
.cat-list{margin-top:8px}
.cat-ed{display:flex;align-items:center;gap:8px;padding:6px 0}
.sw-dot{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 10px 34px;animation:drop .3s var(--ease)}
.sw{width:26px;height:26px;border-radius:50%;background:var(--c);position:relative;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.sw.custom{background:conic-gradient(#E0656B,#E3A43B,#8BB33A,#2A9BB8,#8A5CD1,#E0656B);overflow:hidden}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.cat-list+.chip{margin-top:10px}
.selfrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.selfbtn{height:44px;border-radius:10px;border:1px solid var(--line2);font-weight:600;font-size:13px;padding:0 8px}
.selfbtn.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.selfbtn.wide{grid-column:1 / -1}
.selfrow small{grid-column:1 / -1;font-size:12px;color:var(--dim)}
.mealtog{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 4px;font-size:14px;font-weight:600}
.mealtog input{width:18px;height:18px;accent-color:var(--ink)}
.mealtog small{flex-basis:100%;font-weight:400;font-size:12px;color:var(--dim)}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);width:max-content;
  padding:10px 16px;border-radius:12px;background:var(--hi);color:var(--hi-ink);font-size:13.5px;font-weight:500;line-height:1.45;
  pointer-events:none;opacity:0;transform:translate(-50%,12px) scale(.97);transition:opacity .25s var(--ease),transform .4s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ── 친구 기록 보기 ── */
.viewbar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;
  max-width:528px;margin:0 auto;padding:8px 8px 8px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-size:13.5px;animation:up .45s var(--ease)}
.viewbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewbar button{flex:none;height:34px;padding:0 14px;border-radius:9px;background:var(--hi);color:var(--hi-ink);font-weight:600}
body.viewing .bar{display:none}

/* ── 뽀모도로 화면 ── */
.focus{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--bg);color:var(--ink);animation:fade .35s var(--ease)}
.fx-in{width:min(100%,400px);display:flex;flex-direction:column;align-items:center;gap:16px;animation:rise .5s var(--ease)}
.fx-top{display:flex;align-items:center;gap:8px;font-size:15px;max-width:100%}
.fx-top i{width:7px;height:7px;border-radius:50%;background:var(--fc);flex:none}
.fx-top b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-top span{color:var(--muted);font-size:13px;flex:none}
.fx-stage{position:relative;width:min(76vw,300px);aspect-ratio:1;display:grid;place-items:center}
.fx-stage svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fx-stage .trk{fill:none;stroke:var(--line);stroke-width:1.5}
.fx-stage .arc{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;transition:stroke-dasharray 1s linear}
.focus.brk-ph .fx-stage .arc{stroke:var(--muted)}
.fx-mid{position:relative;text-align:center}
.fx-mid output{display:block;font-size:clamp(60px,19vw,84px);font-weight:700;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.fx-mid small{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
.focus.ready .fx-mid output{animation:pulse 1.4s ease-in-out infinite}
.fx-tom{display:flex;gap:7px}
.fx-tom i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2);transition:background .4s,border-color .4s}
.fx-tom i.on{background:var(--ink);border-color:var(--ink)}
.fx-meta,.fx-note{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6;margin:0}
.fx-note{color:var(--dim)}
.fx-btns{display:flex;gap:8px;width:100%;margin-top:4px}
.fx-btns button{flex:1;height:48px;border-radius:12px;border:1px solid var(--line2);font-size:15px;font-weight:500}
.fx-btns button.pri{background:var(--hi);color:var(--hi-ink);border-color:var(--hi);font-weight:600}
.fx-seg{display:flex;gap:2px}
.fx-seg button{color:var(--dim);font-size:13px;padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.fx-seg button[aria-pressed="true"]{color:var(--ink);background:var(--soft);font-weight:600}

body.sheet-open main{overflow:hidden}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <div class="topwrap" id="topwrap">

</div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
let PX = 1.8; try{ const z = +localStorage.getItem('blockplanner.zoom'); if(z >= 1.2 && z <= 3.2) PX = z; }catch(e){}
const SNAP = 5, DAY_START = 6*60, LS = 'blockplanner.v1';
/* ?view=ID 로 열면 그 ID의 온라인 기록을 읽기 전용으로 보여 줌 (이 기기 기록은 건드리지 않음) */
const VIEW_ID = (() => { try{ const v = new URLSearchParams(location.search).get('view'); return v && /^[a-z0-9_-]{3,24}$/.test(v) ? v : null; }catch(e){ return null; } })();
const PALETTE = ['#3E6FD8','#1E9E7A','#C2457A','#8A5CD1','#D9822B','#2A9BB8','#7A8699','#B5832E'];
const WEEK = ['일','월','화','수','목','금','토'];
const CYR = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
const DEFAULT = {v:1,updatedAt:0,lastCat:'math',
  cats:[{id:'math',name:'수학',color:'#3E6FD8'},{id:'eng',name:'영어',color:'#1E9E7A'},{id:'kor',name:'국어',color:'#C2457A'},{id:'sci',name:'과학',color:'#8A5CD1'},{id:'etc',name:'기타',color:'#7A8699'}],
  days:{},log:[],fixed:[]};

const $ = s => document.querySelector(s);
const tl = $('#tl'), scroller = $('#scroller'), statsEl = $('#stats'), settleEl = $('#settle'), sheetWrap = $('#sheetWrap'), sheet = $('#sheet');
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const uid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const round5 = x => Math.max(5, Math.round(x/5)*5);
const ceil5 = x => Math.ceil(x/5)*5;
const fmt = m => pad(Math.floor(m/60)%24) + ':' + pad(m%60);
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
const dateOf = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k,n) => { const d = dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); };
const parseTime = s => { if(!s) return null; const [h,m] = s.split(':').map(Number); return isNaN(h) ? null : h*60 + (m||0); };
function clock(ms){ const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  return h ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss); }

/* 학교 시간표: 교시 시작 시각 + 요일별 과목 (월=1 … 금=5) */
const PERIODS = [[8,20],[9,20],[10,20],[11,20],[13,10],[14,10],[15,10]];
const TIMETABLE = {
  1:['', '통사A','C_수이C','영어A','통사D','국사','음악'],
  2:['체육1','수학','국어B','실험','C_수이C','영어A',''],
  3:['통사C','음악','국사','국어A','영어B','통사B','생명'],
  4:['국어A','영어B','화학','국사','지구','국어B',''],
  5:['수학','음악','체육1','물리','','','']
};
function schoolSeed(){
  const out = [];
  for(const wd in TIMETABLE) TIMETABLE[wd].forEach((t, i) => {
    out.push({id:`s${wd}-${i+1}`, title:t || '미정', start:PERIODS[i][0]*60 + PERIODS[i][1], dur:50, days:[+wd], skip:[], school:true, period:i+1, ...(t ? {} : {blank:true})});
  });
  return out;
}
function normalize(s){
  const o = Object.assign(clone(DEFAULT), s || {});
  if(!Array.isArray(o.cats) || !o.cats.length) o.cats = clone(DEFAULT.cats);
  if(!o.days || typeof o.days !== 'object') o.days = {};
  for(const k in o.days) if(Array.isArray(o.days[k])) o.days[k] = o.days[k].filter(b => !b.buffer);
  if(!Array.isArray(o.log)) o.log = [];
  if(!Array.isArray(o.fixed)) o.fixed = [];
  if(!('dday' in o)) o.dday = {title:'시험', date:'2026-10-12'};
  if(!o.schoolSeeded){ o.fixed = o.fixed.filter(f => !f.school).concat(schoolSeed()); o.schoolSeeded = true; o.schoolBlankSeeded = true; }
  if(!o.lunchSeeded){
    if(Object.keys(TIMETABLE).length) o.fixed.push({id:'lunch', title:'점심', start:12*60+10, dur:60, days:[1,2,3,4,5], skip:[], meal:true});
    o.lunchSeeded = true;
  }
  if(!o.schoolBlankSeeded){
    const have = new Set(o.fixed.map(f => f.id));
    schoolSeed().filter(f => f.blank && !have.has(f.id)).forEach(f => o.fixed.push(f));
    o.schoolBlankSeeded = true;
  }
  if(!Array.isArray(o.schoolOff)) o.schoolOff = [];
  /* 밀도·원소·테마·쉬는시간 기능을 뺀 뒤 남은 옛 데이터 정리 (배경 사진이 커서 용량을 많이 먹음) */
  ['ledger','dex','dexNew','atLog','freeze','theme','themeNew','bg','pomoLog','session'].forEach(x => delete o[x]);
  return o;
}
function loadLocal(){ try{ const r = localStorage.getItem(LS); return r ? normalize(JSON.parse(r)) : null; }catch(e){ return null; } }

let S = loadLocal() || normalize(null);
if(VIEW_ID) S = normalize(null);
let cur = todayKey(), view = 'plan', drag = null, SH = null, remoteRef = null, syncOn = false;

/* ---------- model ---------- */
const dayList = k => (S.days[k] ||= []);
const catOf = id => S.cats.find(c => c.id === id) || {id:'etc', name:'기타', color:'#7A8699'};
const elapsedMs = b => (b.elapsed||0) + (b.runningSince ? Date.now() - b.runningSince : 0);
const effDur = b => b.done ? b.dur : Math.max(b.dur, Math.ceil(elapsedMs(b)/60000));
function findB(id){ for(const k in S.days){ const b = S.days[k].find(x => x.id === id); if(b) return {b, k}; } return {}; }

function isSelf(f, k){
  const base = !!f.selfStudy || (!!f.school && (S.selfDay || []).includes(k));
  const flip = ((S.selfFlip || {})[k] || []).includes(f.id);
  return base !== flip;
}
function fixedFor(k){
  const wd = dateOf(k).getDay();
  const off = (S.schoolOff || []).includes(k);
  return S.fixed.filter(f => f.days.includes(wd) && (!f.only || f.only === k) && (!f.from || k >= f.from) && (!f.until || k <= f.until) && !(f.skip || []).includes(k) && !(off && f.school))
    .map(f => ({f, s:f.start, d:f.dur, self:isSelf(f, k)})).sort((a,b) => a.s - b.s);
}
function layout(list, pin, k = cur){
  const fx = fixedFor(k).filter(x => !x.self && !x.f.meal);
  const arr = list.map(b => ({b, s:b.start, d:effDur(b)}));
  arr.sort((x,y) => x.s - y.s || (x.b.id === pin ? -1 : y.b.id === pin ? 1 : 0));
  let end = -Infinity;
  const free = (t, d, lo) => t >= lo && !fx.some(f => t < f.s + f.d && t + d > f.s);
  for(const a of arr){
    if(a.s < end) a.s = end;
    /* 옮기는 블록은 수업과 겹치면 뒤로 밀지 않고 가장 가까운 빈 칸(수업 앞 또는 뒤)에 붙임 → 자습 교시 안에 쏙 들어감 */
    if(pin && a.b.id === pin && !free(a.s, a.d, end)){
      let best = null;
      for(const f of fx) for(const c of [f.s - a.d, f.s + f.d]) if(free(c, a.d, Math.max(end, DAY_START)) && (best === null || Math.abs(c - a.s) < Math.abs(best - a.s))) best = c;
      if(best !== null) a.s = best;
    }
    let hit = true;
    while(hit){ hit = false; for(const f of fx) if(a.s < f.s + f.d && a.s + a.d > f.s){ a.s = f.s + f.d; hit = true; } }
    end = a.s + a.d;
  }
  return arr;
}
function commit(k, pin){ layout(dayList(k), pin, k).forEach(a => a.b.start = a.s); }
function lastEnd(k){ const a = layout(dayList(k), null, k); return a.length ? a[a.length-1].s + a[a.length-1].d : null; }
function placeStart(){
  const last = lastEnd(cur);
  if(cur === todayKey()) return Math.max(last ?? 0, Math.max(DAY_START, ceil5(nowMin())));
  return last ?? 16*60;
}
function pauseAll(){
  for(const k in S.days) for(const b of S.days[k]) if(b.runningSince){ b.elapsed = elapsedMs(b); b.runningSince = null; }
}
function toggleRun(id){
  const {b, k} = findB(id); if(!b || b.done) return;
  if(b.runningSince){ b.elapsed = elapsedMs(b); b.runningSince = null; if(S.focus && S.focus.id === id) S.focus = null; }
  else {
    pauseAll();
    if(!b.firstStartAt) b.firstStartAt = Date.now();
    b.runningSince = Date.now();
    if(!isLite(b)) adoptFree(id);
    if(S.focus && !S.focus.free && S.focus.id !== id) S.focus = null;
    if(S.focus && S.focus.id === id && S.focus.phase !== 'focus'){ S.focus.phase = 'focus'; S.focus.t0 = Date.now(); }
  }
  commit(k, id); save(); render();
}
/* 자유 집중 중에 블록을 시작하면 세션을 버리지 않고 그 블록이 이어받음.
   지금 판에서 자유로 보낸 분은 자유 집중 시간에 넣고, 판 수·타이머는 그대로 이어감 */
function adoptFree(id){
  const F = S.focus; if(!F || !F.free) return;
  if(F.phase === 'focus'){
    const m = Math.floor((Date.now() - F.t0)/60000);
    if(m > 0){ S.freeMin ||= {}; const t = todayKey(); S.freeMin[t] = (S.freeMin[t] || 0) + m; }
    if(F.awayAt){ F.cAway = (F.cAway || 0) + (Date.now() - F.awayAt); F.awayAt = null; }
  }
  delete F.free; delete F.awayMs; F.id = id;
}
function complete(id, actual){
  const {b, k} = findB(id); if(!b) return;
  if(b.runningSince){ b.elapsed = elapsedMs(b); b.runningSince = null; }
  const act = Math.max(1, Math.round(actual ?? b.elapsed/60000));
  b.done = true; b.actual = act; b.dur = Math.max(act, 10); b.doneAt = Date.now();
  if(S.focus && S.focus.id === id){ S.focus = null; closeFocus(); }
  S.log = S.log.filter(l => l.id !== b.id);
  S.log.unshift({id:b.id, date:k, title:b.title, cat:b.cat, units:b.units||0, unit:b.unit||'', est:b.est, actual:act});
  commit(k, id); save(); render();
  toast(`${b.title}  예상 ${b.est}분 → 실제 ${act}분`);
}
function undone(id){
  const {b, k} = findB(id); if(!b) return;
  b.done = false; b.actual = null; b.dur = b.est;
  S.log = S.log.filter(l => l.id !== id);
  commit(k, id); save(); render();
}

/* ---------- estimation ---------- */
const sum = (a,f) => a.reduce((t,x) => t + (+x[f]||0), 0);
function suggest(cat, units, unit){
  const L = S.log.filter(l => l.cat === cat);
  if(!L.length) return null;
  const name = catOf(cat).name;
  if(units > 0){
    const U = L.filter(l => l.units > 0 && l.unit === unit);
    if(U.length){
      const per = sum(U,'actual')/sum(U,'units');
      return {min: round5(per*units), why:`${name} ${unit}당 평균 ${per.toFixed(1)}분 × ${units}`};
    }
  }
  const avg = sum(L,'actual')/L.length;
  return {min: round5(avg), why:`${name} 한 번에 평균 ${Math.round(avg)}분 (기록 ${L.length}개)`};
}
function biasFor(cat){
  const all = S.log.filter(l => l.est > 0);
  const c = all.filter(l => l.cat === cat);
  const L = c.length >= 3 ? c : all;
  if(!L.length) return null;
  return {r: sum(L,'actual')/sum(L,'est'), n: L.length};
}

/* ---------- storage ---------- */
let saveTimer = null, writing = Promise.resolve();
function prune(){
  const cut = addDays(todayKey(), -60);
  for(const k in S.days) if(k < cut || !S.days[k].length) delete S.days[k];
  for(const f of S.fixed) if(f.skip) f.skip = f.skip.filter(k => k >= cut);
  S.schoolOff = (S.schoolOff || []).filter(k => k >= cut);
  if(S.memos) S.memos = S.memos.filter(m => !(m.date && m.date < cut && m.done));
  S.fixed = S.fixed.filter(f => (!f.only || f.only >= cut) && (!f.until || f.until >= cut));
  if(S.selfDay) S.selfDay = S.selfDay.filter(k => k >= cut);
  if(S.selfFlip) for(const k in S.selfFlip) if(k < cut) delete S.selfFlip[k];
  if(S.freeMin) for(const k in S.freeMin) if(k < cut) delete S.freeMin[k];
  if(S.log.length > 1500) S.log.length = 1500;
}

const isLite = b => !!(b.review || b.lecture);

      .sort((a,b) => a.s - b.s);
    const now = items.find(i => i.s <= m && m < i.e), next = items.find(i => i.s > m);

  }
  if(h !== nowbarHTML){ nowbarHTML = h; el.innerHTML = h; el.hidden = !h; }
}

  if(!L.length){
    statsEl.innerHTML = '<h2>기록</h2>' + `<div class="stats-empty glass">아직 기록이 없어요.<br>블록에서 ▶를 눌러 시간을 재고 ✓로 끝내면 과목별로 실제 걸린 시간이 쌓여요. 두세 번만 해도 예상 시간이 달라져요.</div>` + syncLine;
    return;
  }
  const withEst = L.filter(l => l.est > 0);
  const r = sum(withEst,'actual')/Math.max(1, sum(withEst,'est'));
  let lead = `예상 대비 실제<b>×${r.toFixed(2)}</b>` + (r >= 1.05 ? '예상보다 오래 걸리는 편이에요.' : r <= 0.95 ? '예상보다 빨리 끝내는 편이에요.' : '예상이 거의 정확해요.');
  const groups = {};
  for(const l of L) (groups[l.cat] ||= []).push(l);
  const rows = Object.entries(groups).map(([cat, g]) => {
    const c = catOf(cat), n = g.length;
    const ea = sum(g,'est')/n, aa = sum(g,'actual')/n;
    const units = {};
    for(const l of g) if(l.units > 0) (units[l.unit] ||= []).push(l);
    const per = Object.entries(units).map(([u, U]) => `${esc(u)}당 <b>${(sum(U,'actual')/sum(U,'units')).toFixed(1)}분</b>`).join('  ');
    return {c, n, ea, aa, per};
  }).sort((a,b) => b.n - a.n);
  const max = Math.max(...rows.map(x => Math.max(x.ea, x.aa)), 1);
  const rowsHTML = rows.map(x => `<div class="cat-row glass" style="--c:${x.c.color}">
    <div class="h"><b>${esc(x.c.name)}</b><span>기록 ${x.n}개</span></div>
    <p>예상 ${Math.round(x.ea)}분 / 실제 <b>${Math.round(x.aa)}분</b>  ×${(x.aa/Math.max(1,x.ea)).toFixed(2)}${x.per ? '<br>' + x.per : ''}</p>
    <div class="cmp"><div class="a" style="width:${x.aa/max*100}%"></div><div class="e" style="left:calc(${x.ea/max*100}% - 1px)"></div></div></div>`).join('');
  const logHTML = L.slice(0, 40).map((l, i) => {
    const d = dateOf(l.date);
    return `<li><span class="d">${d.getMonth()+1}/${d.getDate()}</span><span class="n">${esc(l.title)}</span>
      <span class="v">${l.est} → <b>${l.actual}</b>분</span><button data-del="${i}" aria-label="기록 삭제">✕</button></li>`;
  }).join('');
  statsEl.innerHTML = '<h2>기록</h2>' + `<p class="lead glass">${lead}</p>
    <h2>과목별</h2><p class="legend">막대는 실제 평균, 세로선은 예상 평균이에요.</p>${rowsHTML}
    <h2>최근 기록</h2><ul class="log glass">${logHTML}</ul>${syncLine}`;
}

/* ---------- drag ---------- */
function startDrag(id, mode, e){
  e.preventDefault(); e.stopPropagation();
  const list = dayList(cur), b = list.find(x => x.id === id); if(!b) return;
  commit(cur);
  drag = {id, mode, y0: e.clientY + scroller.scrollTop, orig:{start:b.start, dur:b.dur},
          snap: list.map(x => [x.id, x.start]), el: e.currentTarget, moved:false};
  e.currentTarget.setPointerCapture(e.pointerId);
  const blk = tl.querySelector(`.blk[data-id="${id}"]`); if(blk) blk.classList.add('dragging');
  e.currentTarget.addEventListener('pointermove', onDragMove);
  e.currentTarget.addEventListener('pointerup', endDrag);
  e.currentTarget.addEventListener('pointercancel', endDrag);
}
let dragRaf = 0, dragEv = null;
function onDragMove(e){
  if(!drag) return;
  dragEv = e;
  if(!dragRaf) dragRaf = requestAnimationFrame(() => { dragRaf = 0; if(drag && dragEv) dragFrame(dragEv); });
}
function dragFrame(e){
  const sr = scroller.getBoundingClientRect(), topEdge = sr.top, botEdge = sr.bottom;
  if(e.clientY < topEdge + 40) scroller.scrollTop -= 12;
  else if(e.clientY > botEdge - 40) scroller.scrollTop += 12;
  const dm = Math.round((e.clientY + scroller.scrollTop - drag.y0)/PX/SNAP)*SNAP;
  if(dm !== 0) drag.moved = true;
  const list = dayList(cur);
  const snap = new Map(drag.snap);
  for(const x of list) x.start = snap.get(x.id);
  const b = list.find(x => x.id === drag.id);
  if(drag.mode === 'move') b.start = Math.max(DAY_START, drag.orig.start + dm);
  else b.dur = Math.max(10, drag.orig.dur + dm);
  if(!drag.els){ drag.els = new Map(); tl.querySelectorAll('.blk[data-id]').forEach(el => drag.els.set(el.dataset.id, {el, tm:el.querySelector('.tm'), t:null, h:null})); }
  for(const a of layout(list, drag.id)){
    const c = drag.els.get(a.b.id); if(!c) continue;
    const t = (a.s - DAY_START)*PX + 1, h = a.d*PX - 2;
    if(t !== c.t){ c.el.style.top = t + 'px'; c.t = t; }
    if(h !== c.h){ c.el.style.height = h + 'px'; c.h = h; }
    if(c.tm){ const txt = fmt(a.s) + '–' + fmt(a.s + a.d); if(c.tm.textContent !== txt) c.tm.textContent = txt; }
  }
}
function endDrag(){
  if(!drag) return;
  if(dragRaf){ cancelAnimationFrame(dragRaf); dragRaf = 0; }
  const d = drag; drag = null;
  d.el.removeEventListener('pointermove', onDragMove);
  d.el.removeEventListener('pointerup', endDrag);
  d.el.removeEventListener('pointercancel', endDrag);
  const b = dayList(cur).find(x => x.id === d.id);
  if(b && d.mode === 'resize' && !b.done) b.est = b.dur;
  commit(cur, d.id); save(); render();
}

/* ---------- sheet ---------- */
function openSheet(mode, id, kind){
  let d, b = null;
  if(id){ b = findB(id).b; if(!b) return; }
  if(b){
    d = {title:b.title, cat:b.cat, units:b.units || '', unit:b.unit || '문제', est:b.est,
         start:fmt(Math.min(b.start, 24*60-5)), actual: b.done ? b.actual : (Math.round(elapsedMs(b)/60000) || b.est)};
  } else {
    d = {title:'', cat:S.cats.some(c => c.id === S.lastCat) ? S.lastCat : S.cats[0].id, units:'', unit:'문제', est:30,
         start:fmt(Math.min(placeStart(), 24*60-5)), actual:''};
    if(kind === 'review') d.est = 20;
    else if(kind === 'lecture') d.est = 50;
    else { const sg = suggest(d.cat, 0, d.unit); if(sg) d.est = sg.min; }
  }
  if(b && (b.review || b.lecture)) d.est = b.dur;

  $('#dThumb').setAttribute('cy', (110 + 80*Math.sin(a)).toFixed(1));

    commit(cur, b.id); save(); closeSheet(); render(); scrollTo(b.start);
    return;
  }
  const {b, k} = findB(SH.id); if(!b){ closeSheet(); return; }
  b.title = title;
  b.cat = d.cat; if(!review){ b.units = +d.units || 0; b.unit = d.unit; }
  if(!b.done || isLite(b)){ b.est = d.est; b.dur = d.est; }
  if(b.lecture){ b.progress = d.progress || 0; b.done = d.progress === 1; }
  b.start = start;
  if(b.done && +d.actual > 0){
    b.actual = Math.round(+d.actual); b.dur = Math.max(b.actual, 10);
    const l = S.log.find(x => x.id === b.id);
    if(l) Object.assign(l, {title:b.title, cat:b.cat, units:b.units, unit:b.unit, actual:b.actual});
  }
  commit(k, b.id);
  const id = b.id;
  closeSheet();
  if(mode === 'complete') complete(id, Math.max(1, +d.actual || d.est));
  else { save(); render(); }
}

async function checkUpdate(btn){

    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if(!m) throw 0;
    if(m[1] === APP_VERSION){ btn.textContent = `최신 버전이에요 (v${APP_VERSION})`; }

    const url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = `15577-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){}
  const done = () => toast('내보냈어요. 클립보드에도 복사했어요');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => toast('내보냈어요'));
  else toast('내보냈어요');
}
function importData(txt){
  let o;
  try{ o = JSON.parse((txt || '').trim()); }catch(e){ return toast('JSON 형식이 아니에요. 전체를 복사했는지 확인해 주세요'); }
  if(!o || typeof o !== 'object' || Array.isArray(o) || !(o.days || o.cats || o.log)) return toast('15577 데이터가 아니에요');
  const n = Object.keys(o.days || {}).length;
  if(!confirm(`지금 기기의 기록을 가져온 데이터(${n}일치)로 바꿀까요? 되돌릴 수 없어요.`)) return;
  S = normalize(o); save(); render();
  toast(`가져왔어요. ${n}일치 기록`);
}

/* ---------- misc ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function scrollTo(min){ scroller.scrollTo({top: Math.max(0, (min - DAY_START)*PX - 80), behavior:'smooth'}); }
function initialScroll(){
  const list = layout(dayList(cur));
  const target = cur === todayKey() ? nowMin() - 60 : (list.length ? list[0].s - 30 : 15*60);
  scroller.scrollTop = Math.max(0, (target - DAY_START)*PX);
}

let lastEff = null, tick = 0;
setInterval(() => {
  if(drag || view !== 'plan' || document.hidden) return;
  tick++;
  const r = dayList(cur).find(b => b.runningSince);
  if(r){
    const e = effDur(r);
    if(lastEff !== null && e !== lastEff){ lastEff = e; renderTimeline(); return; }
    lastEff = e;
    const blk = tl.querySelector(`.blk[data-id="${r.id}"]`);
    if(blk){
      const st = blk.querySelector('.st'); if(st) st.textContent = statusText(r);
      blk.classList.toggle('over', elapsedMs(r)/60000 > r.est);
    }
  } else lastEff = null;
  updLed();
  if(tick % 20 === 0){ updateNowLine(); updNowbar(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && !drag && !SH) render(); });

/* 확대: 두 손가락으로 벌리기 (컴퓨터는 Ctrl + 휠) */
const ZMIN = 1.2, ZMAX = 3.2;
let zoomRaf = 0, zoomWant = null;
function setZoom(v, cy){
  v = Math.min(ZMAX, Math.max(ZMIN, Math.round(v*20)/20));
  if(v === PX) return;
  const r = scroller.getBoundingClientRect(), off = (cy == null ? r.top + scroller.clientHeight/2 : cy) - r.top;
  const m = (scroller.scrollTop + off - tl.offsetTop)/PX + DAY_START;
  PX = v; renderTimeline();
  scroller.scrollTop = (m - DAY_START)*PX + tl.offsetTop - off;
  try{ localStorage.setItem('blockplanner.zoom', PX); }catch(e){}
}
function zoomSoon(v, cy){ zoomWant = [v, cy]; if(!zoomRaf) zoomRaf = requestAnimationFrame(() => { zoomRaf = 0; if(zoomWant) setZoom(...zoomWant); }); }
let pz = null;
const tdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
scroller.addEventListener('touchstart', e => { if(e.touches.length === 2 && view === 'plan') pz = {d:tdist(e.touches), px:PX, cy:(e.touches[0].clientY + e.touches[1].clientY)/2}; }, {passive:true});
scroller.addEventListener('touchmove', e => { if(pz && e.touches.length === 2){ e.preventDefault(); zoomSoon(pz.px*tdist(e.touches)/pz.d, pz.cy); } }, {passive:false});
scroller.addEventListener('touchend', e => { if(e.touches.length < 2) pz = null; });
scroller.addEventListener('wheel', e => { if(e.ctrlKey && view === 'plan'){ e.preventDefault(); zoomSoon(PX*(e.deltaY < 0 ? 1.08 : 1/1.08), e.clientY); } }, {passive:false});
let busyT = 0;
function markBusy(){ if(!document.body.classList.contains('busy')) document.body.classList.add('busy'); clearTimeout(busyT); busyT = setTimeout(() => document.body.classList.remove('busy'), 700); }
scroller.addEventListener('scroll', markBusy, {passive:true});
document.addEventListener('pointerdown', markBusy, {passive:true});
document.addEventListener('pointermove', e => { if(e.buttons) markBusy(); }, {passive:true});
new MutationObserver(() => document.body.classList.toggle('sheet-open', !sheetWrap.hidden)).observe(sheetWrap, {attributes:true, attributeFilter:['hidden']});
window.addEventListener('resize', fitChrome);
function openAddPicker(){
  SH = {kind:'pick'};
  sheet.innerHTML = `<div class="sh-head"><h2>추가</h2><button class="icon" data-act="close" aria-label="닫기">✕</button></div>
    <div class="pick">
      <button data-act="pk" data-v="prob"><i>＋</i><b>문풀</b><small>풀 문제. ▶로 시간을 재고 예상 시간을 배워요</small></button>
      <button data-act="pk" data-v="lec"><i>▶︎</i><b>인강</b><small>강의, 성취도는 직접</small></button>
      <button data-act="pk" data-v="rev"><i>✎</i><b>정리</b><small>복습·정리, 체크만</small></button>
      <button data-act="pk" data-v="fix"><i>⌂</i><b>고정 일정</b><small>학원·식사·특강, 반복 또는 기간</small></button>
      <button data-act="pk" data-v="memo"><i>◆</i><b>메모</b><small>까먹을 것 같은 것</small></button>
      <button data-act="pk" data-v="pomo"><i>◎</i><b>뽀모도로</b><small>블록 없이 타이머만</small></button>
    </div>`;
  sheetWrap.hidden = false;
}
function pickAction(t){
  const a = t.dataset.act; if(a === 'close') return closeSheet();
  if(a !== 'pk') return;
  const v = t.dataset.v;
  if(v === 'prob') openSheet('add'); else if(v === 'lec') openSheet('add', null, 'lecture'); else if(v === 'rev') openSheet('add', null, 'review');
  else if(v === 'fix') openFixedSheet(); else if(v === 'pomo'){ closeSheet(); openFocus(null, true); } else openMemoSheet();
}

/* ── 몰입 화면 + 뽀모도로 ──
   ▶를 누르면 전체 화면. 집중(25/50분) 동안 블록 시간이 흐르고, 휴식(5/10분) 동안은 멈춤.
   집중 중에 앱을 벗어난 시간은 '이탈'로 블록에 기록. */
const POMO = [[25,5],[50,10]];
const pomo = () => POMO[S.pomoIdx || 0];
const focusEl = document.createElement('div');
focusEl.className = 'focus'; focusEl.hidden = true;
focusEl.setAttribute('role', 'dialog'); focusEl.setAttribute('aria-modal', 'true'); focusEl.setAttribute('aria-label', '뽀모도로');
document.body.appendChild(focusEl);
let focusSig = '';
function focusBlock(){ const F = S.focus; if(!F || F.free) return {}; return findB(F.id); }
const freeMin = () => ((S.freeMin || {})[todayKey()] || 0);
function openFocus(id, free){
  if(free || (!id && S.focus && S.focus.free)){
    /* 자유 집중: 블록 없이 뽀모도로만 */
    if(!S.focus || !S.focus.free){ S.focus = {free:true, phase:'focus', t0:Date.now(), n:0, awayMs:0}; save(); }
    focusSig = ''; focusEl.hidden = false; document.body.classList.add('sheet-open'); paintFocus(true); updFocusBtn(); return;
  }
  let b = id ? findB(id).b : null;
  if(!b){
    const t = todayKey(), r = dayList(t).find(x => x.runningSince && !isLite(x));
    b = (S.focus && findB(S.focus.id).b) || r;
    if(!b) return openFocus(null, true);
  }
  if(isLite(b) || b.done) return;
  adoptFree(b.id);
  if(!S.focus || S.focus.id !== b.id) S.focus = {id:b.id, phase:'focus', t0:Date.now(), n:0};
  if(!b.runningSince && S.focus.phase === 'focus') toggleRun(b.id);
  focusSig = ''; focusEl.hidden = false; document.body.classList.add('sheet-open');
  paintFocus(true);
}
function closeFocus(){ focusEl.hidden = true; focusSig = ''; document.body.classList.toggle('sheet-open', !sheetWrap.hidden); updFocusBtn(); }
function buzz(msg){
  try{ navigator.vibrate && navigator.vibrate([220, 120, 220]); }catch(e){}
  try{ const A = new (window.AudioContext || window.webkitAudioContext)(), o = A.createOscillator(), g = A.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.0001, A.currentTime); g.gain.exponentialRampToValueAtTime(.2, A.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, A.currentTime + .6); o.connect(g).connect(A.destination); o.start(); o.stop(A.currentTime + .65); }catch(e){}
  if(focusEl.hidden && msg) toast(msg);
}
function resumeFocus(){
  const F = S.focus, {b, k} = focusBlock(); if(!F) return;
  if(F.free){ F.phase = 'focus'; F.t0 = Date.now(); F.awayAt = null; F.cAway = 0; save(); paintFocus(true); return; }
  if(!b) return;
  pauseAll(); b.runningSince = Date.now();
  F.phase = 'focus'; F.t0 = Date.now(); F.awayAt = null; F.cAway = 0;
  commit(k, b.id); save(); render(); paintFocus(true);
}
function focusTick(){
  const F = S.focus; if(!F){ updFocusBtn(); return; }
  const {b, k} = focusBlock();
  if(!F.free && (!b || b.done)){ S.focus = null; localSave(); closeFocus(); return; }
  const [fm, bm] = pomo(), now = Date.now();
  let changed = false;
  if(F.phase === 'focus' && now - F.t0 >= fm*60000){
    const end = F.t0 + fm*60000;
    if(b && b.runningSince){ b.elapsed = Math.max(0, elapsedMs(b) - (now - end)); b.runningSince = null; }
    if(F.awayAt){ const aw = Math.max(0, end - F.awayAt); if(b) b.awayMs = (b.awayMs || 0) + aw; else F.awayMs = (F.awayMs || 0) + aw; F.cAway = (F.cAway || 0) + aw; F.awayAt = null; }
    if(F.free){ S.freeMin ||= {}; const t = todayKey(); S.freeMin[t] = (S.freeMin[t] || 0) + fm; }
    F.phase = 'break'; F.t0 = end; F.n = (F.n || 0) + 1; changed = true;
    F.cAway = 0;
    buzz(`집중 ${fm}분 끝. ${bm}분 쉬어요`);
  }
  if(F.phase === 'break' && now - F.t0 >= bm*60000){
    F.phase = 'ready'; F.t0 = F.t0 + bm*60000; changed = true;
    buzz('휴식 끝. 다시 집중할 시간이에요');
  }
  if(changed){ if(b) commit(k, b.id); save(); if(view === 'plan' && !drag) render(); }
  if(!focusEl.hidden) paintFocus();
  updFocusBtn();
}
function focusLeft(){
  const F = S.focus; if(!F) return null;
  const [fm, bm] = pomo(), now = Date.now();
  return F.phase === 'focus' ? fm*60000 - (now - F.t0) : F.phase === 'break' ? bm*60000 - (now - F.t0) : 0;
}
function updFocusBtn(){
  const el = $('#focusBtn'); if(!el) return;
  const F = S.focus, L = focusLeft();
  const sp = el.querySelector('span');
  const txt = F ? (F.phase === 'ready' ? '다시 집중' : (F.phase === 'break' ? '휴식 ' : '') + clock(Math.max(0, L))) : '뽀모도로';
  if(sp.textContent !== txt) sp.textContent = txt;
  el.classList.toggle('on-focus', !!F);
}
function paintFocus(force){
  const F = S.focus, {b} = focusBlock(); if(!F || (!F.free && !b)){ closeFocus(); return; }
  const [fm, bm] = pomo(), L = Math.max(0, focusLeft()), tot = (F.phase === 'break' ? bm : fm)*60000;
  const frac = F.phase === 'ready' ? 1 : 1 - L/tot;
  const c = b ? catOf(b.cat).color : '#86A6F5';
  const sig = [F.id, F.phase, S.pomoIdx || 0, F.n].join('|');
  if(force || sig !== focusSig){
    focusSig = sig;
    focusEl.className = 'focus' + (F.phase === 'break' ? ' brk-ph' : F.phase === 'ready' ? ' ready' : '');
    focusEl.style.setProperty('--fc', c);
    const done = F.n || 0;
    focusEl.innerHTML = `<div class="fx-in">
      <div class="fx-top"><i></i><b>${b ? esc(b.title) : '자유 집중'}</b><span>${b ? `예상 ${b.est}분` : '블록 없이 뽀모도로만'}</span></div>
      <div class="fx-stage">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="47"/><circle class="arc" id="fxArc" cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="0 100"/></svg>
        <div class="fx-mid"><output id="fxTime"></output><small>${F.phase === 'focus' ? `집중 ${done + 1}번째` : F.phase === 'break' ? '휴식' : '휴식 끝'}</small></div></div>
      <div class="fx-tom" aria-label="끝낸 집중 ${done}번">${Array.from({length:Math.max(4, done + 1)}, (_, i) => `<i class="${i < done ? 'on' : ''}"></i>`).join('')}</div>
      <div class="fx-meta" id="fxMeta"></div>
      <div class="fx-btns">
        ${F.phase === 'focus' ? '<button data-f="min">작게</button>' + (b ? '<button data-f="pause">멈춤</button>' : '')
          : F.phase === 'break' ? '<button data-f="min">작게</button><button data-f="skip">바로 집중</button>'
          : '<button data-f="min">작게</button><button data-f="resume" class="pri">다시 집중</button>'}
        ${b ? `<button data-f="done"${F.phase === 'ready' ? '' : ' class="pri"'}>✓ 완료</button>` : `<button data-f="end"${F.phase === 'ready' ? '' : ' class="pri"'}>끝내기</button>`}</div>
      <div class="fx-seg"><button data-f="away" aria-pressed="${!S.awayOff}">이탈 ${S.awayOff ? '끔' : '켬'}</button></div>
      <div class="fx-seg">${POMO.map((p, i) => `<button data-f="p${i}" aria-pressed="${(S.pomoIdx || 0) === i}">${p[0]}/${p[1]}</button>`).join('')}</div>
      <small class="fx-note">${S.awayOff ? '이탈 기록 꺼짐. 다른 앱(굿노트 등)으로 풀어도 괜찮아요' : '화면을 끄거나 앱을 나가면 이탈로 기록돼요. 굿노트로 풀면 꺼 두세요'}</small>
    </div>`;
  }
  $('#fxTime').textContent = F.phase === 'ready' ? '00:00' : clock(L).padStart(5, '0');
  $('#fxArc').setAttribute('stroke-dasharray', `${(frac*100).toFixed(2)} 100`);
  const away = Math.round((((b ? b.awayMs : F.awayMs) || 0) + (F.awayAt ? Date.now() - F.awayAt : 0))/60000);
  $('#fxMeta').textContent = (b ? `블록 누적 ${clock(elapsedMs(b))} / 예상 ${b.est}분` : `오늘 자유 집중 ${freeMin()}분`) + (away ? ` · 이탈 ${away}분` : '');
}
focusEl.addEventListener('click', e => {
  const t = e.target.closest('[data-f]'); if(!t) return;
  const a = t.dataset.f, F = S.focus, {b} = focusBlock();
  if(a === 'min') return closeFocus();
  if(a === 'away'){ S.awayOff = !S.awayOff; if(S.focus) S.focus.awayAt = null; localSave(); paintFocus(true); return; }
  if(a === 'p0' || a === 'p1'){ S.pomoIdx = +a.slice(1); localSave(); focusTick(); paintFocus(true); return; }
  if(a === 'end'){ const n = F ? F.n || 0 : 0; closeFocus(); S.focus = null; save(); render(); updFocusBtn(); toast(n ? `자유 집중 ${n}번 끝냈어요` : '자유 집중을 끝냈어요'); return; }
  if(!F || (!F.free && !b)) return closeFocus();
  if(F.free && (a === 'skip' || a === 'resume')) return resumeFocus();
  if(a === 'pause'){ closeFocus(); toggleRun(b.id); toast('멈췄어요. ▶로 이어서 할 수 있어요'); return; }
  if(a === 'skip' || a === 'resume') return resumeFocus();
  if(a === 'done'){
    closeFocus(); S.focus = null; updFocusBtn();
    if(elapsedMs(b) >= 60000) complete(b.id); else openSheet('complete', b.id);
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !focusEl.hidden) closeFocus(); });
document.addEventListener('visibilitychange', () => {
  const F = S.focus; if(!F) return;
  if(document.hidden){ if(F.phase === 'focus' && !F.awayAt && !S.awayOff){ F.awayAt = Date.now(); localSave(); } }
  else {
    if(F.awayAt && F.phase === 'focus'){ const {b} = focusBlock(), aw = Date.now() - F.awayAt; if(b) b.awayMs = (b.awayMs || 0) + aw; else F.awayMs = (F.awayMs || 0) + aw; F.cAway = (F.cAway || 0) + aw; F.awayAt = null; save(); }
    focusTick();
  }
});
setInterval(focusTick, 1000);
render();
initialScroll();
initSync();
cloudBoot();
if(S.focus && !VIEW_ID) setTimeout(() => openFocus(), 300);
if(!S.seenPinch && !VIEW_ID){ S.seenPinch = 1; localSave(); setTimeout(() => toast('타임라인 확대는 두 손가락으로 벌리기'), 900); }
})();

</script>
