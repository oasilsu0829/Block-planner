<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+KR:wght@600&display=block" rel="stylesheet">
<style>
html,body{margin:0}
.ic{width:1024px;height:1024px;position:relative;overflow:hidden;
  background:radial-gradient(90% 70% at 100% 0%,#D3E0FF 0%,rgba(211,224,255,0) 65%),radial-gradient(80% 60% at 0% 100%,#E4DDFF 0%,rgba(228,221,255,0) 65%),#F6F8FE}
.g{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;grid-template-columns:290px 290px;gap:34px}
.t{width:290px;height:290px;box-sizing:border-box;border:20px solid #141A2A;border-radius:40px;background:#fff;position:relative;
  box-shadow:0 18px 40px rgba(60,80,150,.18)}
.t.la{background:linear-gradient(160deg,#D3E0FF,#A9C1FF)}
.t b{position:absolute;left:0;right:0;top:50%;transform:translate(-14px,-38%);text-align:center;font:400 178px/1 "Instrument Serif",serif;color:#141A2A;letter-spacing:-4px}
.t i{position:absolute;right:20px;top:16px;font:600 44px/1 "IBM Plex Sans KR",sans-serif;font-style:normal;color:#3A57CF}
.n{width:290px;height:290px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px}
.n hr{width:100%;height:18px;border:0;border-radius:9px;background:#141A2A;margin:0}
.n span{font:italic 400 120px/1 "Instrument Serif",serif;color:#141A2A;letter-spacing:-2px}
</style></head><body>
<div class="ic" id="ic"><div class="g">
 <div class="t"><b>P</b><i>15</i></div>
 <div class="t la"><b>La</b><i>57</i></div>
 <div class="t"><b>N</b><i>7</i></div>
 <div class="n"><hr><span>15577</span><hr></div>
</div></div></body></html>
